name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # Usunięto sekcję pull_request, aby workflow nie uruchamiał się dla PR

jobs:
  build_and_deploy_job:
    # Uruchom tylko jeśli to push do main (redundantne przy 'on: push', ale bezpieczne)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Upewnij się, że nazwa sekretu jest poprawna (patrz krok 2 poniżej)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MUSHROOM_0E60EB103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/eMechanic.Frontend"
          api_location: ""
          output_location: "dist"
